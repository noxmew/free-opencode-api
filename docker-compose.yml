services:
  free-opencode-api:
    image: ghcr.io/noxmew/free-opencode-api:latest
    container_name: free-opencode-api
    restart: unless-stopped
    ports:
      - "${LISTEN_PORT:-8080}:8080"
    environment:
      LISTEN_ADDR: ":8080"
      UPSTREAM_BASE_URL: "${UPSTREAM_BASE_URL:-https://opencode.ai/zen/v1}"
      UPSTREAM_PROXY: "${UPSTREAM_PROXY:-}"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-5m}"
      OPENCODE_PROJECT_ID: "${OPENCODE_PROJECT_ID:-global}"
