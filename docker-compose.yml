services:
  free-opencode-api:
    image: ghcr.io/noxmew/free-opencode-api:latest
    container_name: free-opencode-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HTTP_PROXY: "${HTTP_PROXY:-}"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-5m}"
      OPENCODE_PROJECT_ID: "${OPENCODE_PROJECT_ID:-global}"
