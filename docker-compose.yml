services:
  free-opencode-api:
    image: ghcr.io/noxmew/free-opencode-api:latest
    container_name: free-opencode-api
    restart: unless-stopped
    ports:
      - "${LISTEN_PORT:-8080}:8080"
    environment:
      LISTEN_ADDR: ":8080"
      SERVICE_API_KEY: "${SERVICE_API_KEY:?SERVICE_API_KEY must be set in .env}"
      UPSTREAM_BASE_URL: "${UPSTREAM_BASE_URL:-https://opencode.ai/zen/v1}"
      UPSTREAM_PROXY: "${UPSTREAM_PROXY:-}"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-5m}"
      MAX_BODY_BYTES: "${MAX_BODY_BYTES:-1048576}"
      UPSTREAM_CLIENT_VERSION: "${UPSTREAM_CLIENT_VERSION:-1.18.31}"
      UPSTREAM_USER_AGENT: "${UPSTREAM_USER_AGENT:-}"
      OPENCODE_PROJECT_ID: "${OPENCODE_PROJECT_ID:-global}"
