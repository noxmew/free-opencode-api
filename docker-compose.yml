services:
  free-opencode-api:
    image: ghcr.io/noxmew/free-opencode-api:latest
    container_name: free-opencode-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Fill in one proxy URL when the upstream needs a proxy.
      HTTP_PROXY: ""
